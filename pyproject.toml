[project]
name = "xumari-system"
version = "1.0.0"
description = "XumariSystem – All-in-One Discord bot for design shops & agencies (Components V2)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.7,<2.8",
    "asyncpg>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "PyYAML>=6.0",
    "aiohttp>=3.10",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "stripe>=12.0",
    "httpx>=0.27",
    "aioboto3>=13.0",
    "fpdf2>=2.8",
    "Pillow>=10.4",
    "tzdata>=2024.1",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
